name: Build Java & Push a Docker Hub

on:
  push:
    branches:
      - main          # Se ejecuta al hacer push a 'main'
    tags:
      - 'v*.*.*'      # Se ejecuta al subir un Tag de versión (ej. v1.0.0, v1.0.1)

env:
  DOCKERHUB_USER: carolinaortiz
  IMAGE_NAME: prueba-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: 1. Descargar código (Checkout)
        uses: actions/checkout@v4

      # 2. Configurar Java 21 para compilar Spring Boot
      - name: 2. Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # 3. Empaquetar la aplicación Java en target/mi-backend.jar
      - name: 3. Compilar Microservicio con Maven
        run: mvn clean package -DskipTests

      # 4. Iniciar sesión en tu cuenta de Docker Hub (jeansimon16)
      - name: 4. Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Construir la imagen Docker y publicarla en Docker Hub
      #    - Si subes un Tag (ej. v1.0.0), publica: jeansimon16/mi-backend:v1.0.0
      #    - Si haces push normal a main, publica: jeansimon16/mi-backend:latest
      - name: 5. Construir y subir imagen a Docker Hub
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
          else
            TAG="latest"
          fi

          FULL_IMAGE="${DOCKERHUB_USER}/${IMAGE_NAME}:${TAG}"
          echo "🚀 Construyendo imagen Docker: ${FULL_IMAGE}"
          docker build -t "${FULL_IMAGE}" .

          echo "📦 Subiendo a Docker Hub..."
          docker push "${FULL_IMAGE}"
          echo "✅ Publicado con éxito: https://hub.docker.com/r/${DOCKERHUB_USER}/${IMAGE_NAME}/tags"

